name: Run Recommender Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install numpy pandas

      - name: Run test and save output
        run: |
          python test.py > results.txt

      - name: Upload results file
        uses: actions/upload-artifact@v4
        with:
          name: recommender-results
          path: results.txt
